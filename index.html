<head>

  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer-when-downgrade">

  <!-- Open Graph -->
  <meta property="og:title" content="TypingOS - Free Typing Speed Test Online" />
  <meta property="og:description"
    content="Free typing speed test online. Practice for competitive exams. Track WPM, accuracy, and progress with AI coaching." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TypingOS - Free Typing Speed Test Online" />
  <meta name="twitter:description"
    content="Practice typing online for free. Improve WPM and accuracy with real-time feedback." />
  <meta name="twitter:image" content="https://typingos.com/og-image.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://typingos.com" />
  <link rel="manifest" href="./manifest.json" />

  <!-- JSON-LD: WebApplication Schema -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TypingOS",
      "url": "https://typingos.com",
      "description": "Free online typing speed test and practice platform. Supports SSC, Railway, Banking exam typing tests with real-time WPM and accuracy tracking.",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Free typing speed test",
        "WPM calculator",
        "Touch typing lessons",
        "SSC CGL typing test",
        "Railway exam typing practice",
        "Real-time accuracy tracking",
        "AI typing coach",
        "Multiplayer typing race"
      ],
      "author": {
        "@type": "Organization",
        "name": "TypingOS",
        "url": "https://typingos.com"
      }
    }
  </script>

  <!-- JSON-LD: WebSite with SearchAction -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TypingOS",
      "url": "https://typingos.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://typingos.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000"
    crossorigin="anonymous"></script>

  <!-- GitHub Pages SPA: restore clean URL after 404.html redirect -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        var base = l.pathname.replace(/\/$/, '');
        window.history.replaceState(null, null, base + decoded + l.hash);
      }
    }(window.location));
  </script>
</head>
